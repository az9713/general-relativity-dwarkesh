name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and content
        run: |
          npm run validate:source
          npm run validate:content
          npm run test:unit

      - name: Build production course
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check math layout on desktop and mobile
        env:
          MATH_PAGE_GLOBS: |
            lessons/[0-9]*.html
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python .github/scripts/check_math_layout.py --site dist --globs "$MATH_PAGE_GLOBS"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
